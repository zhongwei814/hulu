<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上传 - 呼噜星球</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.x.x/dist/iconify-icon.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/js/utils.js"></script>
</head>
<body class="min-h-screen bg-[#fffaf5] text-slate-900" x-data="uploadPage()">

<!-- 顶部色条 -->
<div class="fixed inset-x-0 top-0 h-1 bg-orange-500 z-50"></div>

<!-- 导航栏 -->
<header class="sticky top-1 z-40 border-b border-orange-100 bg-[#fffaf5]/95 backdrop-blur">
  <div class="mx-auto flex max-w-[1180px] items-center justify-between px-5 py-4">
    <a href="/" class="flex items-center gap-3 text-left" aria-label="返回首页">
      <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-900 text-xl shadow-lg shadow-slate-900/15">😴</span>
      <span>
        <span class="block text-lg font-black tracking-tight">呼噜星球</span>
        <span class="block text-[11px] font-bold tracking-[0.16em] text-orange-500">SNORE SOCIAL CLUB</span>
      </span>
    </a>
    <a href="/" class="inline-flex items-center gap-2 text-sm font-bold text-slate-500 hover:text-orange-600">
      <iconify-icon icon="solar:arrow-left-linear"></iconify-icon>返回排行榜
    </a>
  </div>
</header>

<main class="mx-auto max-w-[840px] px-5 py-12 md:py-16">

  <div class="mt-6 overflow-hidden rounded-[28px] border border-orange-100 bg-white shadow-xl shadow-orange-950/5">

    <!-- 深色头部 -->
    <div class="bg-slate-900 px-7 py-8 text-white md:px-10">
      <p class="text-xs font-bold tracking-[0.18em] text-orange-300">ANONYMOUS UPLOAD</p>
      <h1 class="mt-2 text-3xl font-black">投递一段夜间杰作</h1>
      <p class="mt-2 text-sm text-slate-300">音频仅用于排行榜展示和 AI 趣味评分。匿名上传，无需注册。</p>
    </div>

    <!-- 表单区 -->
    <div class="p-7 md:p-10">

      <!-- 文件选择 -->
      <label class="block text-sm font-black text-slate-800">选择音频文件</label>
      <input accept=".mp3,.wav,.ogg,.webm" class="hidden" id="audioFile" type="file" x-ref="fileInput" @change="handleFile($refs.fileInput.files[0])">

      <div class="drop-zone mt-3 flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed border-orange-200 bg-orange-50/60 px-5 py-10 text-center hover:border-orange-400 hover:bg-orange-50"
        @click="$refs.fileInput.click()"
        @dragover.prevent="$el.classList.add('drag-over')"
        @dragleave.prevent="$el.classList.remove('drag-over')"
        @drop.prevent="$el.classList.remove('drag-over'); handleDrop($event)">

        <!-- 未选择 -->
        <template x-if="!file">
          <div>
            <iconify-icon class="text-4xl text-orange-500" icon="solar:music-note-upload-bold"></iconify-icon>
            <p class="mt-3 font-bold text-slate-700">点击选择 或 拖拽音频到此处</p>
            <p class="mt-1 text-xs text-slate-500">支持 MP3 / WAV / OGG / WebM，≤ 10MB，≤ 3 分钟</p>
          </div>
        </template>

        <!-- 已选择 -->
        <template x-if="file">
          <div>
            <iconify-icon class="text-4xl text-emerald-500" icon="solar:check-circle-bold"></iconify-icon>
            <p class="mt-3 font-bold text-slate-700" x-text="file.name"></p>
            <p class="mt-1 text-xs text-slate-500" x-text="formatSize(file.size) + ' · 点击可更换文件'"></p>
          </div>
        </template>
      </div>

      <!-- 昵称 -->
      <div class="mt-7">
        <label class="text-sm font-black text-slate-800" for="nickname">
          给自己留个代号 <span class="font-normal text-slate-400">（选填）</span>
        </label>
        <input class="mt-3 w-full rounded-xl border border-slate-200 px-4 py-3.5 text-sm outline-none transition focus:border-orange-400 focus:ring-4 focus:ring-orange-100"
          id="nickname" maxlength="20" placeholder="留空则自动生成匿名代号" x-model="nickname" @keyup.enter="submit()">
      </div>

      <!-- 隐私提示 -->
      <div class="mt-5 rounded-xl bg-slate-50 px-4 py-3 text-xs leading-5 text-slate-500">
        <iconify-icon class="mr-1 align-middle text-base text-emerald-600" icon="solar:shield-check-linear"></iconify-icon>
        提交即代表你确认拥有该音频的分享权限。请勿上传他人的私密录音。
      </div>

      <!-- 错误 -->
      <div x-show="error" class="mt-5 rounded-xl bg-rose-50 border border-rose-200 px-4 py-3 text-sm font-bold text-rose-600" x-text="error"></div>

      <!-- 提交按钮 -->
      <button class="mt-7 flex w-full items-center justify-center gap-2 rounded-xl bg-orange-500 py-4 font-bold text-white shadow-lg shadow-orange-500/20 hover:bg-orange-600 transition disabled:opacity-50 disabled:cursor-not-allowed"
        @click="submit()" :disabled="uploading">
        <iconify-icon icon="solar:rocket-2-bold"></iconify-icon>
        <span x-show="!uploading">提交并开始 AI 评分</span>
        <span x-show="uploading" x-text="'上传中 ' + progress + '%'"></span>
      </button>

      <!-- 进度条 -->
      <div x-show="uploading" class="mt-5">
        <progress :value="progress" max="100" class="w-full h-2"></progress>
      </div>
    </div>
  </div>
</main>

<footer class="border-t border-orange-100 bg-white">
  <div class="mx-auto flex max-w-[1180px] flex-col gap-3 px-5 py-7 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between">
    <p>呼噜星球 · 一个只负责有趣的匿名声音社区</p>
    <p>请理性收听，祝你今晚好眠。</p>
  </div>
</footer>

<script>
function uploadPage() {
  return {
    file: null,
    nickname: '',
    uploading: false,
    progress: 0,
    error: '',

    handleFile(f) {
      this.error = '';
      if (!f) return;
      const ext = '.' + f.name.split('.').pop().toLowerCase();
      if (!['.mp3', '.wav', '.ogg', '.webm'].includes(ext)) {
        this.error = '不支持的格式：' + ext + '（仅支持 mp3 / wav / ogg / webm）';
        return;
      }
      if (f.size > 10 * 1024 * 1024) {
        this.error = '文件大小超过 10MB，请压缩后再上传';
        return;
      }
      this.file = f;
    },

    handleDrop(e) {
      const f = e.dataTransfer.files[0];
      if (f) this.handleFile(f);
    },

    submit() {
      if (!this.file) { this.error = '请先选择一段音频文件'; return; }

      this.uploading = true;
      this.progress = 0;
      this.error = '';

      const form = new FormData();
      form.append('file', this.file);
      form.append('nickname', this.nickname);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/audio/upload');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) this.progress = Math.round(e.loaded / e.total * 100);
      };
      xhr.onload = () => {
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          window.location.href = `/play.html?id=${data.id}`;
        } else {
          try {
            const err = JSON.parse(xhr.responseText);
            this.error = err.detail || '上传失败，请重试';
          } catch (_) { this.error = '上传失败，请重试'; }
          this.uploading = false;
        }
      };
      xhr.onerror = () => { this.error = '网络异常，请检查连接后重试'; this.uploading = false; };
      xhr.send(form);
    },
  };
}
</script>
</body>
</html>
